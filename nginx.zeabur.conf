# PandaFactor Zeabur nginx config: whole-site HTTP Basic Auth + reverse proxy
# to the uvicorn server (same container, port 8111). The FastAPI app serves
# the API (/api/v1, /llm) and the Vue frontend at /factor by itself.
# The htpasswd file is generated at container start from $PANDAFACTOR_AUTH
# (see entrypoint.sh); the plaintext never lands in the repo or image.

server {
    listen 3000;
    server_name _;

    auth_basic "PandaFactor";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
